name: CI Pipeline

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Notifier dependencies
      run: cd notifier-service && pip install -r requirements.txt

    - name: Lint Notifier
      run: cd notifier-service && flake8 .

    - name: Build Docker images
      run: docker-compose build

  test-staging:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/staging' || github.event_name == 'pull_request' && github.base_ref == 'staging'
    steps:
    - uses: actions/checkout@v3

    - name: Start Docker containers
      run: docker-compose up -d

    - name: Wait for services to be healthy
      run: sleep 10

    - name: Test API service
      run: |
        curl --fail http://localhost:3000/todos
        curl --fail -X POST http://localhost:3000/todos -H "Content-Type: application/json" -d '{"text": "Test todo"}'

    - name: Stop containers
      run: docker-compose down